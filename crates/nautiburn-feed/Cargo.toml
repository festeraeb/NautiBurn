[package]
name = "nautiburn-feed"
version = "0.1.0"
edition = "2021"
description = "Feeds varied prompts to live MoE seats and tags their scrape rows with domain and prompt"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json"] }
